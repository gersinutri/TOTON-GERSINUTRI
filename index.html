<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERSI NUTRI - Totem Autoatendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        .hidden { display: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; overflow: hidden; }
        .food-card { transition: transform 0.2s; cursor: pointer; }
        .food-card:active { transform: scale(0.95); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col" onload="carregarCardapio()">

    <header class="bg-[#166534] text-white p-6 text-center shadow-lg">
        <h1 class="text-3xl font-black tracking-widest uppercase">GERSI NUTRI</h1>
        <p class="text-sm opacity-90">Cozinha Saudável e Prática</p>
    </header>

    <main id="menu-area" class="flex-1 overflow-y-auto p-4 grid grid-cols-2 gap-4 bg-gray-50">
        <div class="col-span-2 text-center py-20">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-green-600 border-t-transparent rounded-full mb-4"></div>
            <p class="text-gray-500 font-bold">Atualizando cardápio da Gersi Nutri...</p>
        </div>
    </main>

    <footer class="bg-white p-6 border-t-2 border-gray-100 flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-3">
            <div class="text-3xl">🛒</div>
            <div>
                <p class="text-xs text-gray-400 uppercase font-bold tracking-tighter">Total do Pedido</p>
                <p id="total-value" class="font-black text-2xl text-gray-800">R$ 0,00</p>
            </div>
        </div>
        <button onclick="abrirPagamento()" class="bg-[#22c55e] hover:bg-[#16a34a] text-white px-8 py-4 rounded-2xl font-black text-lg shadow-lg uppercase tracking-tight">
            Pagar via PIX
        </button>
    </footer>

    <div id="payment-screen" class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-10 text-center">
        <h2 class="text-3xl font-black text-gray-800 mb-2">Finalizar Pedido</h2>
        <p id="total-confirm" class="text-2xl text-green-700 font-bold mb-8"></p>
        
        <div class="w-64 h-64 border-4 border-dashed border-green-600 rounded-3xl flex items-center justify-center bg-gray-50 mb-6">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=GERSI_NUTRI_PAGAMENTO" alt="QR Code">
        </div>

        <p class="text-blue-600 font-bold animate-pulse mb-10">Aguardando confirmação do banco...</p>
        <button onclick="fecharPagamento()" class="text-gray-400 font-bold underline uppercase text-sm">Cancelar e voltar</button>
    </div>

    <script>
        let total = 0;
        // Seu link oficial já inserido de forma definitiva:
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQFKTyNpgaIyxIGB6qu5-5IluxLLNuOp_12UfO6D2mxUxfEL0NC2nj_sO1Na8lyzqZ_tNrqE5708GAF/pub?output=csv';

        function carregarCardapio() {
            Papa.parse(URL_CSV, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    montarMenu(results.data);
                },
                error: function() {
                    document.getElementById('menu-area').innerHTML = "<p class='text-center col-span-2 text-red-500'>Erro ao conectar com a planilha.</p>";
                }
            });
        }

        function montarMenu(dados) {
            const container = document.getElementById('menu-area');
            container.innerHTML = ''; 

            if (!dados || dados.length === 0) {
                container.innerHTML = "<p class='text-center col-span-2 text-gray-500'>Nenhum produto encontrado na planilha.</p>";
                return;
            }

            dados.forEach(item => {
                // Encontra as propriedades da planilha independente de estarem maiúsculas ou minúsculas
                const chaves = Object.keys(item);
                const chaveNome = chaves.find(c => c.toLowerCase().trim() === 'nome') || 'Nome';
                const chavePreco = chaves.find(c => c.toLowerCase().trim() === 'preco' || c.toLowerCase().trim() === 'preço') || 'Preco';
                const chaveCat = chaves.find(c => c.toLowerCase().trim() === 'categoria') || 'Categoria';
                const chaveImg = chaves.find(c => c.toLowerCase().trim() === 'imagem') || 'Imagem';

                const nome = item[chaveNome] || 'Produto sem nome';
                const precoTexto = item[chavePreco] ? String(item[chavePreco]) : '0';
                const categoria = item[chaveCat] || 'Geral';
                const imagem = item[chaveImg] || 'https://via.placeholder.com/400x300?text=GERSI+NUTRI';

                // Trata o preço caso o usuário tenha digitado com vírgula ou cifrão
                let precoLimpo = precoTexto.replace('R$', '').replace(/\s/g, '').replace('.', '').replace(',', '.');
                let precoNum = parseFloat(precoLimpo);
                if (isNaN(precoNum)) precoNum = 0;

                if(item[chaveNome]) {
                    container.innerHTML += `
                        <div onclick="adicionarAoCarrinho('${nome}', ${precoNum})" class="food-card bg-white rounded-3xl shadow-md overflow-hidden flex flex-col border border-gray-100">
                            <img src="${imagem}" class="h-44 w-full object-cover" onerror="this.src='https://via.placeholder.com/400x300?text=GERSI+NUTRI'">
                            <div class="p-4 flex-1 flex flex-col justify-between">
                                <div>
                                    <span class="text-[10px] text-green-700 font-bold uppercase tracking-widest">${categoria}</span>
                                    <h3 class="font-bold text-gray-800 text-sm leading-tight mt-1 h-10 overflow-hidden">${nome}</h3>
                                </div>
                                <div class="mt-4 flex items-center justify-between">
                                    <span class="font-black text-lg text-gray-900">R$ ${precoNum.toFixed(2).replace('.', ',')}</span>
                                    <div class="bg-green-100 text-green-800 p-1 rounded-full text-xs">➕</div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            if(container.innerHTML === '') {
                container.innerHTML = "<p class='text-center col-span-2 text-gray-500'>A planilha foi lida, mas as linhas estão sem informações válidas.</p>";
            }
        }

        function adicionarAoCarrinho(nome, preco) {
            total += preco;
            document.getElementById('total-value').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function abrirPagamento() {
            if(total <= 0) return alert("Adicione itens ao carrinho primeiro!");
            document.getElementById('total-confirm').innerText = `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('payment-screen').classList.remove('hidden');
            
            setTimeout(() => {
                alert("SUCESSO! O pedido da GERSI NUTRI foi confirmado.");
                location.reload();
            }, 8000);
        }

        function fecharPagamento() {
            document.getElementById('payment-screen').classList.add('hidden');
        }
    </script>
</body>
</html>
