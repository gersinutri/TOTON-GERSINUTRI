<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERSI NUTRI - Totem Profissional Vertical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        .hidden { display: none; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f8fafc; overflow: hidden; user-select: none; }
        .food-card { transition: all 0.2s ease-out; cursor: pointer; }
        .food-card:active { transform: scale(0.97); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        #cupom-area-impressao { display: none; }

        /* Estilos do Teclado Nativo */
        .keyboard-key { transition: background-color 0.1s ease; -webkit-tap-highlight-color: transparent; }
        .keyboard-key:active { background-color: #cbd5e1 !important; transform: scale(0.95); }
        .keyboard-key-wide { flex-grow: 2; }

        @media print {
            #totem-conteudo-geral { display: none !important; }
            #cupom-area-impressao { 
                display: block !important; 
                width: 80mm !important; 
                font-family: monospace !important; 
                font-size: 13px !important; 
                color: #000000 !important; 
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            pre {
                white-space: pre-wrap !important;
                font-family: monospace !important;
                font-size: 13px !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
