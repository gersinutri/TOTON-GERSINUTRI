<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERSI NUTRI - Layout Categorias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        .cat-btn { transition: all 0.2s; border-left: 6px solid transparent; }
        .cat-btn.active { background-color: white; border-left-color: #166534; color: #166534; }
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- CABEÇALHO -->
    <header class="bg-[#166534] text-white p-4 shadow-lg z-10">
        <h1 class="text-2xl font-black tracking-widest text-center">GERSI NUTRI</h1>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- BARRA LATERAL CATEGORIAS (Esquerda) -->
        <nav id="sidebar-cats" class="w-32 bg-slate-100 flex flex-col pt-4 shadow-inner">
            <!-- Categorias injetadas dinamicamente aqui -->
        </nav>

        <!-- GRADE DE PRODUTOS (Direita) -->
        <main class="flex-1 p-6 overflow-y-auto">
            <h2 id="titulo-categoria" class="text-2xl font-black text-slate-800 mb-6 uppercase tracking-wider">Todos os Produtos</h2>
            <div id="grid-produtos" class="grid grid-cols-2 gap-4">
                <!-- Produtos injetados dinamicamente aqui -->
            </div>
        </main>
    </div>

    <!-- RODAPÉ DE CARRINHO SIMPLIFICADO -->
    <footer class="bg-white border-t p-4 flex justify-between items-center z-10">
        <div class="text-left">
            <p class="text-xs text-slate-400 font-bold uppercase">Total</p>
            <p id="total-geral" class="text-2xl font-black text-slate-800">R$ 0,00</p>
        </div>
        <button class="bg-[#22c55e] text-white px-8 py-3 rounded-xl font-black text-lg uppercase">Finalizar</button>
    </footer>

    <script>
        let cardapio = [];
        let categoriaAtiva = 'TODOS';

        // URL da planilha do Gersi Nutri
        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQFKTyNpgaIyxIGB6qu5-5IluxLLNuOp_12UfO6D2mxUxfEL0NC2nj_sO1Na8lyzqZ_tNrqE5708GAF/pub?gid=0&single=true&output=csv';

        function carregarDados() {
            Papa.parse(URL_CSV, {
                download: true,
                complete: function(results) {
                    cardapio = results.data.filter((row, idx) => idx > 0 && row[0]);
                    renderizarSidebar();
                    renderizarProdutos();
                }
            });
        }

        function renderizarSidebar() {
            const sidebar = document.getElementById('sidebar-cats');
            const cats = ['TODOS', ...new Set(cardapio.map(r => r[2]))];
            
            sidebar.innerHTML = cats.map(cat => `
                <button onclick="filtrar('${cat}')" class="cat-btn ${cat === 'TODOS' ? 'active' : ''} p-4 text-center font-bold text-xs uppercase tracking-wide">
                    ${cat}
                </button>
            `).join('');
        }

        function renderizarProdutos() {
            const grid = document.getElementById('grid-produtos');
            const filtrados = categoriaAtiva === 'TODOS' ? cardapio : cardapio.filter(r => r[2] === categoriaAtiva);

            grid.innerHTML = filtrados.map(item => `
                <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-3">
                    <img src="${item[3]}" class="w-16 h-16 rounded-xl object-cover bg-slate-100">
                    <div>
                        <h3 class="font-black text-sm text-slate-800 leading-tight">${item[0]}</h3>
                        <p class="text-[#166534] font-bold text-lg mt-1">R$ ${item[1]}</p>
                    </div>
                </div>
            `).join('');
        }

        function filtrar(cat) {
            categoriaAtiva = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.toggle('active', btn.innerText === cat));
            document.getElementById('titulo-categoria').innerText = cat;
            renderizarProdutos();
        }

        carregarDados();
    </script>
</body>
</html>
