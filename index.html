<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERSI NUTRI - Totem com Impressão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        .hidden { display: none; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f8fafc; overflow: hidden; user-select: none; }
        .food-card { transition: all 0.2s ease-out; cursor: pointer; }
        .food-card:active { transform: scale(0.97); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* CONFIGURAÇÃO EXCLUSIVA DE IMPRESSÃO: Esconde o site e mostra só o cupom */
        @media print {
            body, header, main, footer, #custom-modal, #payment-screen { display: none !important; }
            #cupom-impressao { display: block !important; width: 80mm; font-family: monospace; font-size: 12px; color: black; background: white; p: 0; margin: 0; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col" onload="carregarCardapio()">

    <div id="cupom-impressao" class="hidden"></div>

    <header class="bg-[#166534] text-white p-6 text-center shadow-md shrink-0">
        <h1 class="text-3xl font-black tracking-widest">GERSI NUTRI</h1>
        <p class="text-xs uppercase tracking-wider opacity-80 mt-1">Alimentação Saudável Inteligente</p>
    </header>

    <main id="menu-area" class="flex-1 overflow-y-auto p-6 grid grid-cols-2 gap-6 bg-slate-50 content-start">
        <div class="col-span-2 text-center py-20">
            <div class="animate-spin inline-block w-10 h-10 border-4 border-[#166534] border-t-transparent rounded-full mb-4"></div>
            <p class="text-slate-600 font-semibold text-lg">Sincronizando com a Cozinha...</p>
        </div>
    </main>

    <footer class="bg-white p-6 border-t border-slate-100 flex items-center justify-between shadow-[0_-8px_30px_rgb(0,0,0,0.04)] shrink-0">
        <div class="flex items-center gap-4">
            <div class="bg-slate-100 p-4 rounded-2xl text-2xl">🛒</div>
            <div>
                <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Seu Pedido</p>
                <p id="total-value" class="font-black text-3xl text-slate-800">R$ 0,00</p>
            </div>
        </div>
        <button onclick="abrirPagamento()" class="bg-[#22c55e] hover:bg-[#16a34a] text-white px-12 py-5 rounded-2xl font-black text-xl shadow-lg transition-all uppercase tracking-wide">
            Finalizar Pedido
        </button>
    </footer>

    <div id="custom-modal" class="hidden fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="relative h-48 shrink-0 bg-slate-100">
                <img id="modal-img" class="w-full h-full object-cover" src="" alt="">
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-4">
                <div>
                    <span id="modal-cat" class="text-xs text-green-700 font-black uppercase tracking-widest block"></span>
                    <h2 id="modal-nome" class="text-2xl font-black text-slate-800 mt-1"></h2>
                    <p id="modal-preco-base" class="text-base text-slate-500 font-bold mt-1"></p>
                </div>
                <div class="border-t border-b border-slate-100 py-4 flex items-center justify-between bg-slate-50/50 px-4 rounded-2xl">
                    <p class="font-bold text-slate-700">Quantidade</p>
                    <div class="flex items-center gap-4">
                        <button onclick="alterarQtd(-1)" class="w-12 h-12 rounded-xl bg-slate-200 text-2xl font-bold text-slate-800 flex items-center justify-center active:bg-slate-300">-</button>
                        <span id="modal-qtd" class="text-xl font-black text-slate-800 w-8 text-center">1</span>
                        <button onclick="alterarQtd(1)" class="w-12 h-12 rounded-xl bg-slate-200 text-2xl font-bold text-slate-800 flex items-center justify-center active:bg-slate-300">+</button>
                    </div>
                </div>
                <div id="adicionais-secao" class="pt-2">
                    <p class="font-bold text-slate-700 mb-1">Adicionais</p>
                    <p class="text-xs text-slate-400 mb-3">Turbine seu prato:</p>
                    <div id="adicionais-lista" class="space-y-2"></div>
                </div>
            </div>
            <div class="p-6 bg-slate-50 border-t border-slate-100 flex items-center justify-between shrink-0">
                <button onclick="fecharModal()" class="text-slate-500 font-bold uppercase text-sm tracking-wide hover:text-slate-700">Voltar</button>
                <button onclick="confirmarInclusao()" id="btn-adicionar-carrinho" class="bg-[#166534] text-white px-8 py-4 rounded-xl font-black shadow-md text-base">
                    Adicionar R$ 0,00
                </button>
            </div>
        </div>
    </div>

    <div id="payment-screen" class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-10 text-center">
        <h2 class="text-4xl font-black text-slate-800 mb-2">Aponte a Câmera</h2>
        <p id="total-confirm" class="text-3xl text-green-700 font-black mb-8"></p>
        <div class="w-64 h-64 border-4 border-dashed border-green-600 rounded-3xl flex items-center justify-center bg-slate-50 p-4 mb-6 shadow-inner">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=GERSI_NUTRI_TOTEM" id="pix-qr" class="w-full h-full object-contain">
        </div>
        <p class="text-blue-600 font-bold animate-pulse text-lg mb-4">Processando pagamento em tempo real...</p>
        
        <button onclick="dispararImpressao()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold mb-10 text-xs uppercase tracking-wider">
            [Simular Confirmação do Banco e Imprimir]
        </button>
        
        <button onclick="fecharPagamento()" class="text-slate-400 font-bold underline uppercase text-sm tracking-wider block">Cancelar Operação</button>
    </div>

    <script>
        let totalGeral = 0;
        let cardapioOriginal = [];
        let itemAtual = null;
        let carrinhoItens = []; // Guarda a lista de itens para gerar o cupom

        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQFKTyNpgaIyxIGB6qu5-5IluxLLNuOp_12UfO6D2mxUxfEL0NC2nj_sO1Na8lyzqZ_tNrqE5708GAF/pub?gid=0&single=true&output=csv';

        function carregarCardapio() {
            Papa.parse(URL_CSV, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    cardapioOriginal = results.data;
                    montarMenu(results.data);
                }
            });
        }

        function extrairPreco(item) {
            const chaves = Object.keys(item);
            const cPreco = chaves.find(c => {
                const norm = c.toLowerCase().trim().replace('ç', 'c');
                return norm === 'preco' || norm === 'preço' || norm === 'valor';
            });
            if (!cPreco || !item[cPreco]) return 0;
            let texto = String(item[cPreco]).trim();
            let limpo = texto.replace('R$', '').replace(/\s/g, '').replace(',', '.');
            return parseFloat(limpo) || 0;
        }

        function montarMenu(dados) {
            const container = document.getElementById('menu-area');
            container.innerHTML = ''; 
            dados.forEach((item, index) => {
                const chaves = Object.keys(item);
                const cNome = chaves.find(c => c.toLowerCase().trim() === 'nome');
                const cCat = chaves.find(c => c.toLowerCase().trim() === 'categoria');
                const cImg = chaves.find(c => c.toLowerCase().trim() === 'imagem');

                if(!item[cNome] || item[cNome].trim() === "") return;

                const nome = item[cNome];
                const categoria = item[cCat] || 'Nutri';
                const imagem = item[cImg] || 'https://via.placeholder.com/400x300?text=GERSI+NUTRI';
                const precoNum = extrairPreco(item);

                container.innerHTML += `
                    <div onclick="configurarItem(${index})" class="food-card bg-white rounded-3xl shadow-md overflow-hidden flex flex-col border border-slate-100 h-80">
                        <div class="h-44 w-full overflow-hidden shrink-0 bg-slate-100">
                            <img src="${imagem}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400x300?text=GERSI+NUTRI'">
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between bg-white text-left">
                            <div>
                                <span class="text-[10px] text-green-700 font-black uppercase tracking-widest block mb-0.5">${categoria}</span>
                                <h3 class="font-bold text-slate-800 text-base leading-tight h-10 overflow-hidden">${nome}</h3>
                            </div>
                            <div class="flex items-center justify-between mt-2">
                                <span class="font-black text-lg text-slate-900">R$ ${precoNum.toFixed(2).replace('.', ',')}</span>
                                <div class="bg-green-50 text-green-700 px-3 py-1.5 rounded-xl text-xs font-black uppercase tracking-wider">Escolher</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function configurarItem(index) {
            const item = cardapioOriginal[index];
            const chaves = Object.keys(item);
            
            const nome = item[chaves.find(c => c.toLowerCase().trim() === 'nome')];
            const cat = item[chaves.find(c => c.toLowerCase().trim() === 'categoria')] || 'Nutri';
            const img = item[chaves.find(c => c.toLowerCase().trim() === 'imagem')] || '';
            const adiTexto = item[chaves.find(c => c.toLowerCase().trim() === 'adicionais')] || '';
            const prcAdiTexto = item[chaves.find(c => c.toLowerCase().trim() === 'precosadicionais')] || '';

            const precoNum = extrairPreco(item);

            itemAtual = { nome, precoBase: precoNum, qtd: 1, imagem: img, categoria: cat, adicionaisEscolhidos: {} };

            document.getElementById('modal-img').src = img;
            document.getElementById('modal-cat').innerText = cat;
            document.getElementById('modal-nome').innerText = nome;
            document.getElementById('modal-preco-base').innerText = `Preço unitário: R$ ${precoNum.toFixed(2).replace('.', ',')}`;
            document.getElementById('modal-qtd').innerText = '1';

            const listaAdi = document.getElementById('adicionais-lista');
            listaAdi.innerHTML = '';

            if(adiTexto && adiTexto.trim() !== "") {
                const nomesAdi = adiTexto.split(',');
                const valoresAdi = prcAdiTexto.split(',');
                nomesAdi.forEach((n, i) => {
                    const nomeAdi = n.trim();
                    const valAdi = parseFloat(valoresAdi[i]?.trim()) || 0;
                    gerarHtmlAdicional(nomeAdi, valAdi, listaAdi);
                });
            } else {
                gerarHtmlAdicional("Salada Extra", 3.50, listaAdi);
                gerarHtmlAdicional("Molho Especial", 2.00, listaAdi);
            }

            atualizarPrecoModal();
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function gerarHtmlAdicional(nomeAdi, valAdi, container) {
            container.innerHTML += `
                <label class="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-100 active:bg-slate-200 cursor-pointer">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" onchange="toggleAdicional('${nomeAdi}', ${valAdi}, this)" class="w-5 h-5 accent-[#166534] rounded">
                        <span class="font-bold text-slate-700 text-sm">${nomeAdi}</span>
                    </div>
                    <span class="text-sm font-extrabold text-slate-500">+ R$ ${valAdi.toFixed(2).replace('.', ',')}</span>
                </label>
            `;
        }

        function alterarQtd(valor) {
            if(itemAtual.qtd + valor < 1) return;
            itemAtual.qtd += valor;
            document.getElementById('modal-qtd').innerText = itemAtual.qtd;
            atualizarPrecoModal();
        }

        function toggleAdicional(nome, valor, checkbox) {
            if(checkbox.checked) { itemAtual.adicionaisEscolhidos[nome] = valor; } 
            else { delete itemAtual.adicionaisEscolhidos[nome]; }
            atualizarPrecoModal();
        }

        function atualizarPrecoModal() {
            let subtotalUnitario = itemAtual.precoBase;
            for(let key in itemAtual.adicionaisEscolhidos) { subtotalUnitario += itemAtual.adicionaisEscolhidos[key]; }
            const totalItem = subtotalUnitario * itemAtual.qtd;
            document.getElementById('btn-adicionar-carrinho').innerText = `Adicionar R$ ${totalItem.toFixed(2).replace('.', ',')}`;
            itemAtual.totalCalculado = totalItem;
        }

        function fecharModal() { document.getElementById('custom-modal').classList.add('hidden'); }

        function confirmarInclusao() {
            totalGeral += itemAtual.totalCalculado;
            carrinhoItens.push(itemAtual); // Salva o item estruturado no carrinho
            document.getElementById('total-value').innerText = `R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
            fecharModal();
        }

        function abrirPagamento() {
            if(totalGeral <= 0) return alert("Selecione algum item primeiro!");
            document.getElementById('total-confirm').innerText = `Total: R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
            document.getElementById('payment-screen').classList.remove('hidden');
        }

        function fecharPagamento() { document.getElementById('payment-screen').classList.add('hidden'); }

        // GERADOR E DISPARADOR DA IMPRESSÃO AUTOMÁTICA
        function dispararImpressao() {
            const numeroSenha = Math.floor(Math.random() * 90) + 10; // Senha aleatória entre 10 e 99
            const divCupom = document.getElementById('cupom-impressao');
            
            // Monta o cabeçalho do recibo
            let textoCupom = `
                <div style="text-align:center; font-weight:bold; font-size:16px;">GERSI NUTRI</div>
                <div style="text-align:center; margin-bottom:10px;">Alimentacao Saudavel</div>
                <div>----------------------------------------</div>
                <div>Senha: <span style="font-size:20px; font-weight:bold;">${numeroSenha}</span></div>
                <div>Data: ${new Date().toLocaleDateString('pt-BR')} - ${new Date().toLocaleTimeString('pt-BR')}</div>
                <div>----------------------------------------</div>
                <div style="font-weight:bold; display:flex; justify-content:space-between;">
                    <span>Item</span><span>Total</span>
                </div>
                <div>----------------------------------------</div>
            `;

            // Percorre os produtos comprados
            carrinhoItens.forEach(item => {
                textoCupom += `
                    <div style="display:flex; justify-content:space-between; font-weight:bold; margin-top:5px;">
                        <span>${item.qtd}x ${item.nome}</span>
                        <span>R$ ${item.totalCalculado.toFixed(2).replace('.',',')}</span>
                    </div>
                `;
                // Lista os adicionais escolhidos embaixo do nome do produto, se houver
                for(let adi in item.adicionaisEscolhidos) {
                    textoCupom += `<div style="font-size:11px; padding-left:10px;">+ ${adi}</div>`;
                }
            });

            // Monta o rodapé do recibo
            textoCupom += `
                <div>----------------------------------------</div>
                <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:14px;">
                    <span>TOTAL:</span><span>R$ ${totalGeral.toFixed(2).replace('.',',')}</span>
                </div>
                <div>----------------------------------------</div>
                <div style="text-align:center; font-weight:bold; margin-top:10px;">PAGAMENTO CONFIRMADO VIA PIX</div>
                <div style="text-align:center; margin-top:5px; font-size:10px;">Obrigado e bom apetite!</div>
                <br><br><br>
            `;

            divCupom.innerHTML = textoCupom;

            // Executa o comando de impressão do navegador
            window.print();

            // Após fechar a janela de impressão, o totem limpa os dados e reseta para o próximo cliente
            totalGeral = 0;
            carrinhoItens = [];
            document.getElementById('total-value').innerText = "R$ 0,00";
            fecharPagamento();
        }
    </script>
</body>
</html>
