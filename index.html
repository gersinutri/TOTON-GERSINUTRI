<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERSI NUTRI - Totem Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        .cat-btn { transition: all 0.3s; border-left: 8px solid transparent; }
        .cat-btn.active { background-color: white; border-left-color: #16a34a; color: #166534; font-weight: 900; }
        
        .slide-container { position: relative; overflow: hidden; border-radius: 20px; height: 180px; width: 100%; margin-bottom: 24px; border: 4px solid #faedcd; }
        .slide-item { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; display: flex; align-items: center; background: #166534; color: white; padding: 20px; }
        .slide-item.active { opacity: 1; z-index: 10; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col" onload="carregarDados()">

    <header class="bg-[#166534] text-white p-4 shadow-lg text-center">
        <h1 class="text-2xl font-black tracking-widest">GERSI NUTRI</h1>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <nav id="sidebar-cats" class="w-36 bg-[#15803d] text-white flex flex-col pt-4 shadow-xl shrink-0"></nav>

        <main class="flex-1 p-6 overflow-y-auto">
            <div id="promo-slider" class="slide-container shadow-xl"></div>
            <h2 id="titulo-categoria" class="text-xl font-black text-slate-800 mb-4 uppercase">Todos</h2>
            <div id="grid-produtos" class="grid grid-cols-2 gap-4 content-start"></div>
        </main>
    </div>

    <!-- MODAL CUSTOMIZAÇÃO -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg p-6 space-y-4">
            <img id="modal-img" class="w-full h-40 object-cover rounded-2xl">
            <h2 id="modal-nome" class="text-2xl font-black"></h2>
            <div class="flex items-center justify-between bg-slate-100 p-4 rounded-xl">
                <button onclick="alterarQtd(-1)" class="w-10 h-10 bg-white rounded-lg font-bold">-</button>
                <span id="modal-qtd" class="text-xl font-black">1</span>
                <button onclick="alterarQtd(1)" class="w-10 h-10 bg-white rounded-lg font-bold">+</button>
            </div>
            <button onclick="confirmarInclusao()" id="btn-adicionar" class="w-full bg-[#166534] text-white py-4 rounded-xl font-black">Adicionar</button>
        </div>
    </div>

    <script>
        let cardapio = [], carrinho = [], total = 0, catAtiva = 'TODOS', itemAtual = {};

        function carregarDados() {
            Papa.parse('https://docs.google.com/spreadsheets/d/e/2PACX-1vQFKTyNpgaIyxIGB6qu5-5IluxLLNuOp_12UfO6D2mxUxfEL0NC2nj_sO1Na8lyzqZ_tNrqE5708GAF/pub?gid=0&single=true&output=csv', {
                download: true,
                complete: (results) => {
                    cardapio = results.data.filter((row, idx) => idx > 0 && row[0]);
                    renderizarSidebar();
                    renderizarBanner();
                    renderizarProdutos();
                }
            });
        }

        function renderizarBanner() {
            const slider = document.getElementById('promo-slider');
            const ofertas = cardapio.filter(r => ['OFERTA', 'COMBO', 'DESTAQUE'].includes(r[2].toUpperCase()));
            slider.innerHTML = ofertas.map((o, i) => `
                <div class="slide-item ${i === 0 ? 'active' : ''}">
                    <div>
                        <span class="bg-amber-400 text-black px-2 py-1 text-[10px] font-black uppercase rounded">15% OFF</span>
                        <h2 class="text-2xl font-black mt-2">${o[0]}</h2>
                        <p class="text-lg font-bold line-through opacity-70">De R$ ${(parseFloat(o[1].replace(',', '.'))*1.176).toFixed(2)}</p>
                        <p class="text-3xl font-black text-green-300">Por R$ ${o[1]}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderizarProdutos() {
            const grid = document.getElementById('grid-produtos');
            const prods = catAtiva === 'TODOS' ? cardapio : cardapio.filter(r => r[2] === catAtiva);
            grid.innerHTML = prods.map((p, i) => `
                <div onclick="abrirModal(${cardapio.indexOf(p)})" class="bg-white p-4 rounded-2xl shadow-sm border flex items-center gap-4 cursor-pointer">
                    <img src="${p[3]}" class="w-20 h-20 rounded-xl object-cover">
                    <div>
                        <h3 class="font-black text-lg">${p[0]}</h3>
                        <p class="text-[#166534] font-black text-xl">R$ ${p[1]}</p>
                    </div>
                </div>
            `).join('');
        }

        function abrirModal(idx) {
            itemAtual = { ...cardapio[idx], qtd: 1, preco: parseFloat(cardapio[idx][1].replace(',', '.')) };
            document.getElementById('modal-img').src = itemAtual[3];
            document.getElementById('modal-nome').innerText = itemAtual[0];
            document.getElementById('modal-qtd').innerText = '1';
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function alterarQtd(v) {
            if (itemAtual.qtd + v > 0) {
                itemAtual.qtd += v;
                document.getElementById('modal-qtd').innerText = itemAtual.qtd;
            }
        }

        function confirmarInclusao() {
            carrinho.push(itemAtual);
            total += (itemAtual.preco * itemAtual.qtd);
            document.getElementById('custom-modal').classList.add('hidden');
            alert("Item adicionado!");
        }

        function renderizarSidebar() {
            const cats = ['TODOS', ...new Set(cardapio.map(r => r[2]))];
            document.getElementById('sidebar-cats').innerHTML = cats.map(cat => `
                <button onclick="catAtiva='${cat}'; renderizarProdutos()" class="cat-btn p-4 text-center text-sm uppercase">${cat}</button>
            `).join('');
        }
    </script>
</body>
</html>
