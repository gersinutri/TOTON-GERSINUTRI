<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERSI NUTRI - Totem Profissional Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; overflow: hidden; user-select: none; }
        
        .sidebar-btn { 
            transition: all 0.25s ease-in-out; 
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }
        .sidebar-btn.active { 
            background-color: #ffffff !important; 
            color: #166534 !important; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .slide-container { position: relative; overflow: hidden; border-radius: 24px; height: 190px; width: 100%; border: 4px solid #faedcd; }
        .slide-item { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #166534; color: white; }
        .slide-item.active { opacity: 1; z-index: 10; }
        
        ::-webkit-scrollbar { width: 0px; }
        #cupom-area-impressao { display: none; }

        @media print {
            #totem-conteudo-geral { display: none !important; }
            #cupom-area-impressao { 
                display: block !important; 
                width: 80mm !important; 
                font-family: monospace !important; 
                font-size: 13px !important; 
                color: #000000 !important; 
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            pre {
                white-space: pre-wrap !important;
                font-family: monospace !important;
                font-size: 13px !important;
                margin: 0 !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col" onload="carregarDados()">

    <div id="cupom-area-impressao"></div>

    <div id="totem-conteudo-geral" class="h-screen w-screen flex flex-col relative">
        <header class="bg-[#166534] text-white p-4 shadow-md shrink-0 text-center">
            <h1 class="text-3xl font-black tracking-widest">GERSI NUTRI</h1>
            <p class="text-xs uppercase tracking-wider opacity-85 mt-0.5">Alimentação Saudável Inteligente</p>
        </header>

        <div class="flex flex-1 overflow-hidden relative">
            <nav id="sidebar" class="w-28 bg-[#15803d] text-white flex flex-col gap-3 p-2.5 overflow-y-auto shrink-0 shadow-2xl">
                </nav>

            <main class="flex-1 p-6 overflow-y-auto bg-slate-50 flex flex-col">
                <div id="promo-slider" class="slide-container shadow-xl shrink-0 mb-6">
                    </div>

                <h2 id="cat-title" class="text-2xl font-black text-slate-800 mb-5 uppercase tracking-wide">Todos</h2>
                
                <div id="grid" class="grid grid-cols-2 gap-4 content-start flex-1">
                    </div>
            </main>
        </div>

        <footer class="bg-white border-t p-5 flex justify-between items-center z-20 shadow-[0_-8px_30px_rgba(0,0,0,0.06)] shrink-0">
            <button id="btn-carrinho-aba" onclick="abrirResumoCarrinho()" class="flex items-center gap-4 bg-slate-100 hover:bg-slate-200 p-3 px-6 rounded-2xl transition-all active:scale-95">
                <span class="text-3xl">🛒</span>
                <span id="carrinho-contador" class="bg-red-500 text-white font-black w-7 h-7 rounded-full text-xs flex items-center justify-center">0</span>
                <div class="text-left">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Seu Pedido</p>
                    <p id="total-value" class="font-black text-2xl text-slate-800">R$ 0,00</p>
                </div>
            </button>
            <button onclick="abrirTelaConferencia()" class="bg-[#22c55e] hover:bg-[#16a34a] text-white px-14 py-5 rounded-2xl font-black text-2xl uppercase shadow-lg active:scale-95 transition-transform">Finalizar Pedido</button>
        </footer>

        <div id="addons-modal" class="hidden fixed inset-0 bg-black/60 z-[51] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-3xl w-full max-w-lg flex flex-col overflow-hidden shadow-2xl">
                <div class="p-5 border-b bg-slate-50 text-center relative">
                    <h2 id="addon-product-name" class="font-black text-xl text-slate-800 truncate">Configurar Prato</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Escolha seus acompanhamentos e adicionais</p>
                    <button onclick="fecharModal('addons-modal')" class="absolute right-5 top-5 font-bold text-xl text-slate-400 hover:text-slate-600">✕</button>
                </div>
                
                <div class="p-6 overflow-y-auto max-h-[50vh] space-y-5 text-left">
                    <div>
                        <label class="block font-black text-sm text-slate-700 uppercase tracking-wide mb-2">1. Escolha a Base (Obrigatório):</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center gap-3 p-3 border rounded-xl bg-slate-50 cursor-pointer">
                                <input type="radio" name="base_carb" value="Arroz Integral" checked class="w-5 h-5 accent-green-700">
                                <span class="text-sm font-bold text-slate-700">Arroz Integral</span>
                            </label>
                            <label class="flex items-center gap-3 p-3 border rounded-xl bg-slate-50 cursor-pointer">
                                <input type="radio" name="base_carb" value="Purê de Batata Doce" class="w-5 h-5 accent-green-700">
                                <span class="text-sm font-bold text-slate-700">Purê Batata Doce</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block font-black text-sm text-slate-700 uppercase tracking-wide mb-2">2. Acompanhamento (Obrigatório):</label>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="flex items-center gap-3 p-3 border rounded-xl bg-slate-50 cursor-pointer">
                                <input type="radio" name="base_acomp" value="Feijão Carioca" checked class="w-5 h-5 accent-green-700">
                                <span class="text-sm font-bold text-slate-700">Feijão Carioca</span>
                            </label>
                            <label class="flex items-center gap-3 p-3 border rounded-xl bg-slate-50 cursor-pointer">
                                <input type="radio" name="base_acomp" value="Legumes Grelhados" class="w-5 h-5 accent-green-700">
                                <span class="text-sm font-bold text-slate-700">Legumes Grelhados</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block font-black text-sm text-slate-700 uppercase tracking-wide mb-2">3. Deseja Adicionais Extras?</label>
                        <div class="space-y-2">
                            <label class="flex items-center justify-between p-3 border rounded-xl bg-slate-50 cursor-pointer">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" id="extra-ovo" value="Ovo Frito Extra" data-price="2.00" class="w-5 h-5 accent-green-700">
                                    <span class="text-sm font-bold text-slate-700">Ovo Frito Extra</span>
                                </div>
                                <span class="text-sm font-black text-green-700">+ R$ 2,00</span>
                            </label>
                            <label class="flex items-center justify-between p-3 border rounded-xl bg-slate-50 cursor-pointer">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" id="extra-frango" value="Proteína Extra (Frango)" data-price="6.00" class="w-5 h-5 accent-green-700">
                                    <span class="text-sm font-bold text-slate-700">Proteína Extra (Frango)</span>
                                </div>
                                <span class="text-sm font-black text-green-700">+ R$ 6,00</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="p-4 bg-slate-50 border-t flex items-center justify-between">
                    <button onclick="fecharModal('addons-modal')" class="text-slate-500 font-bold px-4 py-2 text-sm">Cancelar</button>
                    <button onclick="confirmarAdicionaisDoPrato()" class="bg-[#166534] text-white font-black px-8 py-3 rounded-xl uppercase text-sm tracking-wider shadow-md">Adicionar ao Pedido</button>
                </div>
            </div>
        </div>

        <div id="cart-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-3xl w-full max-w-lg max-h-[80vh] flex flex-col overflow-hidden shadow-2xl">
                <div class="p-5 border-b flex justify-between items-center bg-slate-50">
                    <h2 class="font-black text-2xl text-slate-800">Itens no Pedido</h2>
                    <button onclick="fecharModal('cart-modal')" class="font-bold text-2xl text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div id="lista-carrinho" class="p-5 overflow-y-auto flex-1 space-y-3 content-start"></div>
                <div class="p-5 bg-slate-50 border-t flex justify-between items-center shrink-0">
                    <div>
                        <p class="text-xs text-slate-400 font-bold uppercase">Subtotal</p>
                        <p id="modal-total-carrinho" class="text-2xl font-black text-slate-800">R$ 0,00</p>
                    </div>
                    <button onclick="fecharModal('cart-modal')" class="bg-[#166534] text-white font-black px-6 py-3 rounded-xl uppercase text-xs tracking-wider">Voltar</button>
                </div>
            </div>
        </div>

        <div id="review-modal" class="hidden fixed inset-0 bg-black/60 z-[52] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-3xl w-full max-w-xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
                <div class="p-6 border-b text-center bg-slate-50">
                    <h3 class="text-2xl font-black text-slate-800">Confirme o seu Pedido 🍽️</h3>
                    <p class="text-slate-400 text-sm mt-1">Veja itens e opcionais escolhidos antes de pagar</p>
                </div>
                <div id="lista-conferencia-itens" class="p-6 overflow-y-auto flex-1 space-y-3 bg-slate-50/50"></div>
                <div class="p-6 bg-white border-t flex flex-col gap-4 shrink-0">
                    <div class="flex justify-between items-center px-2">
                        <span class="font-bold text-slate-500 text-base uppercase">Total do Pedido:</span>
                        <span id="total-conferencia-valor" class="text-3xl font-black text-[#166534]">R$ 0,00</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="fecharModal('review-modal')" class="bg-slate-200 text-slate-700 font-black py-4 rounded-xl uppercase text-sm tracking-wider active:scale-95 transition-transform">Adicionar Mais Itens</button>
                        <button onclick="avancarParaSeletorPagamento()" class="bg-[#22c55e] hover:bg-[#16a34a] text-white font-black py-4 rounded-xl uppercase text-sm tracking-wider shadow-md active:scale-95 transition-transform">Confirmar e Pagar</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="method-modal" class="hidden fixed inset-0 bg-black/60 z-[55] flex
