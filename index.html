<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERSI NUTRI - Totem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; }
        .sidebar-btn { transition: all 0.2s; border-left: 6px solid transparent; }
        .sidebar-btn.active { background-color: #ffffff; border-left-color: #166534; color: #166534; font-weight: 800; }
        .slide-banner { background: #166534; border-radius: 16px; padding: 20px; color: white; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    </style>
</head>
<body class="h-screen flex flex-col" onload="carregarDados()">

    <header class="bg-[#166534] text-white p-4 text-center font-black text-xl shadow-md z-20">GERSI NUTRI</header>

    <div class="flex flex-1 overflow-hidden">
        <nav id="sidebar" class="w-32 bg-slate-100 flex flex-col pt-4 overflow-y-auto"></nav>

        <main class="flex-1 p-6 overflow-y-auto">
            <div id="banner" class="slide-banner"></div>
            <h2 id="cat-title" class="text-2xl font-black text-slate-800 mb-6 uppercase">Todos</h2>
            <div id="grid" class="grid grid-cols-2 gap-4"></div>
        </main>
    </div>

    <footer class="bg-white border-t p-4 flex justify-between items-center z-20 shadow-2xl">
        <div class="flex items-center gap-4 bg-slate-100 p-3 rounded-xl">
            <span class="text-2xl">🛒</span>
            <span id="carrinho-contador" class="font-black text-xl">0</span>
            <div class="text-left">
                <p class="text-[10px] text-slate-400 font-bold uppercase">Total</p>
                <p id="total-geral" class="font-black text-lg">R$ 0,00</p>
            </div>
        </div>
        <button onclick="alert('Indo para pagamento...')" class="bg-[#22c55e] text-white px-10 py-4 rounded-xl font-black text-lg uppercase shadow-lg">Finalizar</button>
    </footer>

    <script>
        let cardapio = [], total = 0, qtd = 0;
        function carregarDados() {
            Papa.parse('https://docs.google.com/spreadsheets/d/e/2PACX-1vQFKTyNpgaIyxIGB6qu5-5IluxLLNuOp_12UfO6D2mxUxfEL0NC2nj_sO1Na8lyzqZ_tNrqE5708GAF/pub?gid=0&single=true&output=csv', {
                download: true,
                complete: (results) => {
                    cardapio = results.data.filter((r, i) => i > 0 && r[0]);
                    renderizarSidebar();
                    renderizarBanner();
                    renderizarProdutos();
                }
            });
        }

        function renderizarSidebar() {
            const cats = ['TODOS', ...new Set(cardapio.map(r => r[2]))];
            document.getElementById('sidebar').innerHTML = cats.map(c => 
                `<button onclick="filtrar('${c}')" class="sidebar-btn p-4 text-xs uppercase">${c}</button>`
            ).join('');
        }

        function renderizarBanner() {
            const oferta = cardapio.find(r => r[2].toUpperCase().includes('OFERTA') || r[2].toUpperCase().includes('COMBO'));
            if(oferta) {
                document.getElementById('banner').innerHTML = `
                    <div><span class="bg-amber-400 text-black text-[10px] font-black px-2 py-1 rounded">15% OFF</span>
                    <h2 class="text-xl font-black">${oferta[0]}</h2></div>
                    <p class="text-3xl font-black">R$ ${oferta[1]}</p>
                `;
            }
        }

        function renderizarProdutos(cat = 'TODOS') {
            const lista = cat === 'TODOS' ? cardapio : cardapio.filter(r => r[2] === cat);
            document.getElementById('grid').innerHTML = lista.map(p => `
                <div class="bg-white p-4 rounded-xl border flex items-center gap-4">
                    <img src="${p[3]}" class="w-16 h-16 rounded-lg object-cover">
                    <div class="flex-1">
                        <h3 class="font-bold text-sm">${p[0]}</h3>
                        <p class="text-[#166534] font-black">R$ ${p[1]}</p>
                    </div>
                    <button onclick="adicionar('${p[1]}')" class="bg-[#166534] text-white w-10 h-10 rounded-lg text-2xl font-black">+</button>
                </div>
            `).join('');
        }

        function adicionar(preco) {
            total += parseFloat(preco.replace(',', '.'));
            qtd++;
            document.getElementById('total-geral').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('carrinho-contador').innerText = qtd;
        }

        function filtrar(c) {
            document.getElementById('cat-title').innerText = c;
            renderizarProdutos(c);
        }
    </script>
</body>
</html>
