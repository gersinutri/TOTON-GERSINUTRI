<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GERSI NUTRI - Totem Vertical Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        .hidden { display: none; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f1f5f9; overflow: hidden; user-select: none; }
        .food-card { transition: all 0.2s ease-out; cursor: pointer; }
        .food-card:active { transform: scale(0.96); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        #cupom-area-impressao { display: none; }

        @media print {
            #totem-conteudo-geral { display: none !important; }
            #cupom-area-impressao { 
                display: block !important; 
                width: 80mm !important; 
                font-family: monospace !important; 
                font-size: 13px !important; 
                color: #000000 !important; 
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            pre {
                white-space: pre-wrap !important;
                font-family: monospace !important;
                font-size: 13px !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col" onload="carregarCardapio()">

    <div id="cupom-area-impressao"></div>

    <div id="totem-conteudo-geral" class="h-screen w-screen flex flex-col">
        <header class="bg-[#166534] text-white p-8 text-center shadow-lg shrink-0 z-10">
            <h1 class="text-4xl font-black tracking-widest">GERSI NUTRI</h1>
            <p class="text-sm uppercase tracking-wider opacity-90 mt-1">Alimentação Saudável Inteligente</p>
        </header>

        <main class="flex-1 overflow-y-auto p-8 bg-slate-100 flex justify-center">
            <div id="menu-area" class="w-full max-w-5xl grid grid-cols-3 gap-6 content-start pb-12">
                <div class="col-span-3 text-center py-20">
                    <div class="animate-spin inline-block w-12 h-12 border-4 border-[#166534] border-t-transparent rounded-full mb-4"></div>
                    <p class="text-slate-600 font-bold text-xl">Sincronizando com a Cozinha...</p>
                </div>
            </div>
        </main>

        <footer class="bg-white p-8 border-t border-slate-200 flex items-center justify-between shadow-[0_-10px_30px_rgb(0,0,0,0.05)] shrink-0 z-10">
            <div class="flex items-center gap-5">
                <div class="bg-slate-100 p-5 rounded-2xl text-3xl">🛒</div>
                <div>
                    <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Seu Pedido</p>
                    <p id="total-value" class="font-black text-4xl text-slate-800">R$ 0,00</p>
                </div>
            </div>
            <button onclick="abrirPagamento()" class="bg-[#22c55e] hover:bg-[#16a34a] text-white px-16 py-6 rounded-2xl font-black text-2xl shadow-xl transition-all uppercase tracking-wide">
                Finalizar Pedido
            </button>
        </footer>

        <div id="custom-modal" class="hidden fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-6 backdrop-blur-sm">
            <div class="bg-white rounded-[2.5rem] w-full max-w-xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
                <div class="relative h-64 shrink-0 bg-slate-50 flex items-center justify-center overflow-hidden border-b border-slate-100">
                    <img id="modal-img" class="max-w-full max-h-full object-contain" src="" alt="">
                </div>
                <div class="p-8 overflow-y-auto flex-1 space-y-6">
                    <div>
                        <span id="modal-cat" class="text-sm text-green-700 font-black uppercase tracking-widest block"></span>
                        <h2 id="modal-nome" class="text-3xl font-black text-slate-800 mt-1"></h2>
                        <p id="modal-preco-base" class="text-lg text-slate-500 font-bold mt-1"></p>
                    </div>
                    
                    <div class="border-t border-b border-slate-100 py-5 flex items-center justify-between bg-slate-50/50 px-6 rounded-2xl">
                        <p class="font-bold text-xl text-slate-700">Quantidade</p>
                        <div class="flex items-center gap-5">
                            <button onclick="alterarQtd(-1)" class="w-14 h-14 rounded-2xl bg-slate-200 text-3xl font-bold text-slate-800 flex items-center justify-center active:bg-slate-300">-</button>
                            <span id="modal-qtd" class="text-2xl font-black text-slate-800 w-10 text-center">1</span>
                            <button onclick="alterarQtd(1)" class="w-14 h-14 rounded-2xl bg-slate-200 text-3xl font-bold text-slate-800 flex items-center justify-center active:bg-slate-300">+</button>
                        </div>
                    </div>
                    <div id="adicionais-secao" class="pt-2">
                        <p class="font-bold text-lg text-slate-700 mb-1">Adicionais</p>
                        <p class="text-xs text-slate-400 mb-4">Turbine seu prato:</p>
                        <div id="adicionais-lista" class="space-y-3"></div>
                    </div>
                </div>
                <div class="p-8 bg-slate-50 border-t border-slate-100 flex items-center justify-between shrink-0">
                    <button onclick="fecharModal()" class="text-slate-500 font-bold uppercase text-base tracking-wide hover:text-slate-700">Voltar</button>
                    <button onclick="confirmarInclusao()" id="btn-adicionar-carrinho" class="bg-[#166534] text-white px-10 py-5 rounded-2xl font-black text-lg shadow-md">
                        Adicionar R$ 0,00
                    </button>
                </div>
            </div>
        </div>

        <div id="payment-screen" class="hidden fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-12 text-center">
            <h2 class="text-5xl font-black text-slate-800 mb-3">Aponte a Câmera</h2>
            <p id="total-confirm" class="text-4xl text-green-700 font-black mb-12"></p>
            <div class="w-80 h-80 border-4 border-dashed border-green-600 rounded-[2rem] flex items-center justify-center bg-slate-50 p-6 mb-8 shadow-inner">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=GERSI_NUTRI_TOTEM" id="pix-qr" class="w-full h-full object-contain">
            </div>
            <p class="text-blue-600 font-bold animate-pulse text-2xl mb-16">Processando pagamento em tempo real...</p>
            
            <button onclick="dispararImpressao()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-2xl font-black mb-14 text-base uppercase tracking-wider shadow-lg">
                [ Simular Pagamento e Imprimir ]
            </button>
            
            <button onclick="fecharPagamento()" class="text-slate-400 font-bold underline uppercase text-base tracking-wider block">Cancelar Operação</button>
        </div>
    </div>

    <script>
        let totalGeral = 0;
        let cardapioOriginal = [];
        let itemAtual = null;
        let carrinhoItens = [];

        const URL_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQFKTyNpgaIyxIGB6qu5-5IluxLLNuOp_12UfO6D2mxUxfEL0NC2nj_sO1Na8lyzqZ_tNrqE5708GAF/pub?gid=0&single=true&output=csv';

        function carregarCardapio() {
            Papa.parse(URL_CSV, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    cardapioOriginal = results.data;
                    montarMenu(results.data);
                }
            });
        }

        function extrairPreco(item) {
            const chaves = Object.keys(item);
            const cPreco = chaves.find(c => {
                const norm = c.toLowerCase().trim().replace('ç', 'c');
                return norm === 'preco' || norm === 'preço' || norm === 'valor';
            });
            if (!cPreco || !item[cPreco]) return 0;
            let texto = String(item[cPreco]).trim();
            let limpo = texto.replace('R$', '').replace(/\s/g, '').replace(',', '.');
            return parseFloat(limpo) || 0;
        }

        function montarMenu(dados) {
            const container = document.getElementById('menu-area');
            container.innerHTML = ''; 
            dados.forEach((item, index) => {
                const chaves = Object.keys(item);
                const cNome = chaves.find(c => c.toLowerCase().trim() === 'nome');
                const cCat = chaves.find(c => c.toLowerCase().trim() === 'categoria');
                const cImg = chaves.find(c => c.toLowerCase().trim() === 'imagem');

                if(!item[cNome] || item[cNome].trim() === "") return;

                const nome = item[cNome];
                const categoria = item[cCat] || 'Nutri';
                const imagem = item[cImg] || 'https://via.placeholder.com/400x300?text=GERSI+NUTRI';
                const precoNum = extrairPreco(item);

                // CORRIGIDO: object-contain + bg-slate-50 ADICIONADOS PARA IMPEDIR FOTOS ACHATADAS
                container.innerHTML += `
                    <div onclick="configurarItem(${index})" class="food-card bg-white rounded-2xl shadow-md overflow-hidden flex flex-col border border-slate-200 h-80">
                        <div class="h-44 w-full flex items-center justify-center bg-slate-50/50 p-2 shrink-0 overflow-hidden">
                            <img src="${imagem}" class="max-w-full max-h-full object-contain rounded-xl" onerror="this.src='https://via.placeholder.com/400x300?text=GERSI+NUTRI'">
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between text-left">
                            <div>
                                <span class="text-[9px] text-green-700 font-black uppercase tracking-widest block mb-1">${categoria}</span>
                                <h3 class="font-bold text-slate-800 text-sm leading-tight h-10 overflow-hidden">${nome}</h3>
                            </div>
                            <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-50">
                                <span class="font-black text-base text-slate-900">R$ ${precoNum.toFixed(2).replace('.', ',')}</span>
                                <div class="bg-green-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-wider shadow-sm">Escolher</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function configurarItem(index) {
            const item = cardapioOriginal[index];
            const chaves = Object.keys(item);
            
            const nome = item[chaves.find(c => c.toLowerCase().trim() === 'nome')];
            const cat = item[chaves.find(c => c.toLowerCase().trim() === 'categoria')] || 'Nutri';
            const img = item[chaves.find(c => c.toLowerCase().trim() === 'imagem')] || '';
            const adiTexto = item[chaves.find(c => c.toLowerCase().trim() === 'adicionais')] || '';
            const prcAdiTexto = item[chaves.find(c => c.toLowerCase().trim() === 'precosadicionais')] || '';

            const precoNum = extrairPreco(item);

            itemAtual = { nome, precoBase: precoNum, qtd: 1, imagem: img, categoria: cat, adicionaisEscolhidos: {} };

            document.getElementById('modal-img').src = img;
            document.getElementById('modal-cat').innerText = cat;
            document.getElementById('modal-nome').innerText = nome;
            document.getElementById('modal-preco-base').innerText = `Preço unitário: R$ ${precoNum.toFixed(2).replace('.', ',')}`;
            document.getElementById('modal-qtd').innerText = '1';

            const listaAdi = document.getElementById('adicionais-lista');
            listaAdi.innerHTML = '';

            if(adiTexto && adiTexto.trim() !== "") {
                const nomesAdi = adiTexto.split(',');
                const valoresAdi = prcAdiTexto.split(',');
                nomesAdi.forEach((n, i) => {
                    const nomeAdi = n.trim();
                    const valAdi = parseFloat(valoresAdi[i]?.trim()) || 0;
                    gerarHtmlAdicional(nomeAdi, valAdi, listaAdi);
                });
            } else {
                gerarHtmlAdicional("Salada Extra", 3.50, listaAdi);
                gerarHtmlAdicional("Molho Especial", 2.00, listaAdi);
            }

            atualizarPrecoModal();
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function gerarHtmlAdicional(nomeAdi, valAdi, container) {
            container.innerHTML += `
                <label class="flex items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-100 active:bg-slate-200 cursor-pointer">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" onchange="toggleAdicional('${nomeAdi}', ${valAdi}, this)" class="w-6 h-6 accent-[#166534] rounded">
                        <span class="font-bold text-slate-700 text-base">${nomeAdi}</span>
                    </div>
                    <span class="text-base font-extrabold text-slate-500">+ R$ ${valAdi.toFixed(2).replace('.', ',')}</span>
                </label>
            `;
        }

        function alterarQtd(valor) {
            if(itemAtual.qtd + valor < 1) return;
            itemAtual.qtd += valor;
            document.getElementById('modal-qtd').innerText = itemAtual.qtd;
            atualizarPrecoModal();
        }

        function toggleAdicional(nome, valor, checkbox) {
            if(checkbox.checked) { itemAtual.adicionaisEscolhidos[nome] = valor; } 
            else { delete itemAtual.adicionaisEscolhidos[nome]; }
            atualizarPrecoModal();
        }

        function atualizarPrecoModal() {
            let subtotalUnitario = itemAtual.precoBase;
            for(let key in itemAtual.adicionaisEscolhidos) { subtotalUnitario += itemAtual.adicionaisEscolhidos[key]; }
            const totalItem = subtotalUnitario * itemAtual.qtd;
            document.getElementById('btn-adicionar-carrinho').innerText = `Adicionar R$ ${totalItem.toFixed(2).replace('.', ',')}`;
            itemAtual.totalCalculado = totalItem;
        }

        function fecharModal() { document.getElementById('custom-modal').classList.add('hidden'); }

        function confirmarInclusao() {
            totalGeral += itemAtual.totalCalculado;
            carrinhoItens.push(JSON.parse(JSON.stringify(itemAtual)));
            document.getElementById('total-value').innerText = `R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
            fecharModal();
        }

        function abrirPagamento() {
            if(totalGeral <= 0) return alert("Selecione algum item primeiro!");
            document.getElementById('total-confirm').innerText = `Total: R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
            document.getElementById('payment-screen').classList.remove('hidden');
        }

        function fecharPagamento() { document.getElementById('payment-screen').classList.add('hidden'); }

        function dispararImpressao() {
            const numeroSenha = Math.floor(Math.random() * 90) + 10;
            const containerCupom = document.getElementById('cupom-area-impressao');
            
            let textoCupom = `========================================\n`;
            textoCupom += `              GERSI NUTRI               \n`;
            textoCupom += `========================================\n`;
            textoCupom += `Senha: ${numeroSenha}\n`;
            textoCupom += `Data: ${new Date().toLocaleDateString('pt-BR')} - ${new Date().toLocaleTimeString('pt-BR')}\n`;
            textoCupom += `----------------------------------------\n`;
            textoCupom += `Qtd  Item                       Total\n`;
            textoCupom += `----------------------------------------\n`;

            carrinhoItens.forEach(item => {
                textoCupom += `${item.qtd}x   ${item.nome.padEnd(25, ' ')} R$ ${item.totalCalculado.toFixed(2).replace('.',',')}\n`;
                for(let adi in item.adicionaisEscolhidos) {
                    textoCupom += `     + ${adi}\n`;
                }
            });

            textoCupom += `----------------------------------------\n`;
            textoCupom += `TOTAL DO PEDIDO:        R$ ${totalGeral.toFixed(2).replace('.',',')}\n`;
            textoCupom += `----------------------------------------\n`;
            textoCupom += `       PAGAMENTO CONFIRMADO VIA PIX     \n`;
            textoCupom += `========================================\n`;

            containerCupom.innerHTML = `<pre>${textoCupom}</pre>`;

            setTimeout(() => {
                window.print();
                totalGeral = 0;
                carrinhoItens = [];
                document.getElementById('total-value').innerText = "R$ 0,00";
                containerCupom.innerHTML = ""; 
                fecharPagamento();
            }, 400);
        }
    </script>
</body>
</html>
